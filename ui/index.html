<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <title>Archivo de Claude</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <img src="icono.svg" alt="" width="26" height="26">
      <div>
        <h1>Archivo de Claude</h1>
        <p id="estado-linea" class="sutil">Cargando…</p>
      </div>
    </div>
    <div class="acciones-barra">
      <button id="btn-ajustes" class="boton fantasma" title="Destinos, fuentes y configuración" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
      <button id="btn-sincronizar" class="boton primario">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6 6 6 0 0 1-.7 2.8l1.46 1.46A8 8 0 0 0 20 12a8 8 0 0 0-8-8Zm0 14a6 6 0 0 1-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A8 8 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4v3Z"/></svg>
        <span>Sincronizar ahora</span>
      </button>
    </div>
  </header>

  <div id="aviso" class="aviso" hidden></div>
  <div id="progreso" class="progreso" hidden>
    <div class="progreso-texto"><span id="progreso-titulo">Sincronizando…</span><span id="progreso-detalle" class="sutil"></span></div>
    <div class="progreso-barra"><div id="progreso-relleno"></div></div>
  </div>

  <main class="cuerpo">
    <aside class="panel-lista" aria-label="Conversaciones">
      <div class="buscador">
        <input id="filtro" type="search" placeholder="Filtrar por título o carpeta…" autocomplete="off" aria-label="Filtrar conversaciones">
        <button id="btn-buscar" class="boton chico" title="Busca en el texto completo de todas las conversaciones">Buscar en el contenido</button>
      </div>
      <div class="filtros" role="tablist" aria-label="Origen">
        <button class="chip activo" data-filtro="todas">Todas</button>
        <button class="chip" data-filtro="claude">En Claude</button>
        <button class="chip" data-filtro="borradas">Borradas en Claude</button>
        <button class="chip" data-filtro="recuperadas">Recuperadas</button>
        <button class="chip" data-filtro="pendientes">Sin respaldar</button>
      </div>
      <div class="filtros-2">
        <select id="proyecto" aria-label="Carpeta del proyecto"><option value="">Todas las carpetas</option></select>
        <label class="check"><input id="ver-vacias" type="checkbox"> Vacías</label>
      </div>
      <div id="contador" class="contador sutil"></div>
      <div id="lista" class="lista" role="list"></div>
    </aside>

    <section id="visor" class="visor" aria-live="polite"></section>
  </main>

  <div id="ajustes" class="cajon" hidden>
    <div class="cajon-fondo" data-cerrar></div>
    <div class="cajon-panel" role="dialog" aria-modal="true" aria-labelledby="ajustes-titulo">
      <div class="cajon-cabecera">
        <h2 id="ajustes-titulo">Ajustes</h2>
        <button class="boton fantasma" data-cerrar aria-label="Cerrar">✕</button>
      </div>
      <div id="ajustes-cuerpo" class="cajon-cuerpo"></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-fondo" data-cerrar></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-cabecera"><h3 id="modal-titulo"></h3><button class="boton fantasma" data-cerrar aria-label="Cerrar">✕</button></div>
      <div id="modal-cuerpo" class="modal-cuerpo"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
